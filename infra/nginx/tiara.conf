# ============================================================
# Nginx サイト設定 — tiara
#
# 配置先: /etc/nginx/sites-available/tiara.conf
# 有効化: ln -s /etc/nginx/sites-available/tiara.conf /etc/nginx/sites-enabled/
#
# SSL は certbot が自動追加する:
#   certbot --nginx -d your-domain.com
# ============================================================

# BFF upstream
upstream bff {
    server 127.0.0.1:3001;
}

# Backend upstream（画像配信用）
upstream backend {
    server 127.0.0.1:1323;
}

# ==============================
# www → apex への正規化リダイレクト（URL の重複インデックス防止）
# 前提: DNS に www の A レコードがあり、証明書に www が含まれること
#   certbot --nginx -d tiara-hakodate.com -d www.tiara-hakodate.com
# ==============================
server {
    listen 80;
    server_name www.tiara-hakodate.com;
    return 301 https://tiara-hakodate.com$request_uri;
}

server {
    listen 80;
    server_name tiara-hakodate.com;  # ← 実際のドメインに変更すること

    # ==============================
    # セキュリティヘッダー
    # ==============================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ==============================
    # gzip 圧縮（テキスト系アセットの転送量削減）
    # ==============================
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml text/plain;

    # ==============================
    # Frontend 静的ファイル配信
    # ==============================
    root /var/www/tiara;
    index index.html;

    # Vue Router (history mode) — 該当ファイルがなければ index.html へフォールバック
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静的アセットのキャッシュ（Vite がハッシュ付きファイル名を生成するため長期キャッシュ可能）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ==============================
    # API リバースプロキシ → BFF
    # ==============================
    location /api/ {
        proxy_pass http://bff;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # API ドキュメント（/api/v1/docs, /api/v1/redoc 等）を検索エンジンにインデックスさせない。
        # 注意: location 内で add_header を書くと server レベルの add_header は継承されないため再掲する。
        add_header X-Robots-Tag "noindex" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # タイムアウト設定
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # ==============================
    # アップロード画像 → Backend 直接プロキシ
    # BFF を経由せず Nginx から直接 Backend へ振り分けることで効率化
    # ==============================
    location /uploads/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # 画像キャッシュ（1日）
        proxy_cache_valid 200 1d;
        expires 1d;
        add_header Cache-Control "public";
    }

    # ==============================
    # アクセスログ・エラーログ
    # ==============================
    access_log /var/log/nginx/tiara_access.log;
    error_log  /var/log/nginx/tiara_error.log;
}

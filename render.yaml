# ============================================================
# Render Blueprint — tiara-web-app
# https://render.com/docs/blueprint-spec
# ============================================================

databases:
  - name: tiara-db
    plan: free
    databaseName: tiara
    postgresMajorVersion: '16'

services:
  # ==============================
  # Backend (Go + Docker)
  # ==============================
  - type: web
    name: tiara-backend
    runtime: docker
    plan: free
    dockerfilePath: ./packages/backend/Dockerfile
    dockerContext: ./packages/backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tiara-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://tiara-bff.onrender.com
      - key: PORT
        value: '1323'
      - key: UPLOAD_DIR
        value: uploads

  # ==============================
  # BFF (Hono + Node.js)
  # ==============================
  - type: web
    name: tiara-bff
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile
    startCommand: pnpm --filter bff start
    envVars:
      - key: BACKEND_URL
        value: https://tiara-backend.onrender.com
      - key: CORS_ORIGIN
        value: https://tiara-frontend.onrender.com
      - key: PORT
        value: '3001'
      - key: NODE_VERSION
        value: '20'

  # ==============================
  # Frontend (Vue 3 + Vite — Static Site)
  # ==============================
  - type: web
    name: tiara-frontend
    runtime: static
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter frontend build
    staticPublishPath: packages/frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://tiara-bff.onrender.com
      - key: NODE_VERSION
        value: '20'

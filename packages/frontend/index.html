<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" />

    <!--
      title / description / OGP / canonical は unhead がページごとに生成する。
      サイト共通の既定値は src/lib/seo.ts、各ページの設定は usePageMeta() を参照。
    -->

    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!--
      priceRange と geo（緯度経度）は近似値。
      運営者が確認のうえ必要に応じて差し替えること。
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://tiara-hakodate.com/#website",
            "name": "Tiara",
            "alternateName": "ティアラ",
            "url": "https://tiara-hakodate.com/",
            "inLanguage": "ja-JP"
          },
          {
            "@type": "NightClub",
            "@id": "https://tiara-hakodate.com/#organization",
            "name": "Tiara",
            "alternateName": [
              "ティアラ",
              "クラブ ティアラ",
              "ニュークラブ ティアラ",
              "New Club TIARA"
            ],
            "url": "https://tiara-hakodate.com/",
            "description": "函館・五稜郭のニュークラブ・キャバクラ「ティアラ(TIARA)」の公式サイト。在籍キャストのプロフィールや最新の出勤スケジュール、料金システム、店舗へのアクセスまで、公式ならではの正確な情報でご案内します。",
            "image": "https://tiara-hakodate.com/og-image.png",
            "logo": "https://tiara-hakodate.com/og-image.png",
            "areaServed": "函館",
            "address": {
              "@type": "PostalAddress",
              "postalCode": "040-0011",
              "addressRegion": "北海道",
              "addressLocality": "函館市",
              "streetAddress": "本町1-28 第5大栄ビル 1F 右",
              "addressCountry": "JP"
            },
            "geo": {
              "@type": "GeoCoordinates",
              "latitude": 41.796,
              "longitude": 140.754
            },
            "priceRange": "¥8,000〜",
            "telephone": "+81-80-2818-2554",
            "openingHoursSpecification": {
              "@type": "OpeningHoursSpecification",
              "dayOfWeek": [
                "Monday",
                "Tuesday",
                "Wednesday",
                "Thursday",
                "Friday",
                "Saturday",
                "Sunday"
              ],
              "opens": "20:00",
              "closes": "05:00"
            },
            "sameAs": [
              "https://www.tiktok.com/discover/%E3%83%8B%E3%83%A5%E3%83%BC%E3%82%AF%E3%83%A9%E3%80%80%E3%83%86%E3%82%A3%E3%82%A2%E3%83%A9%E5%87%BD%E9%A4%A8"
            ],
            "mainEntityOfPage": {
              "@id": "https://tiara-hakodate.com/#website"
            }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
